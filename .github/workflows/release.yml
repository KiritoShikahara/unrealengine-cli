name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name=unreal-cli-${{ matrix.target }}
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.archive }}" = zip ]; then 7z a ../../../$name.zip unreal-cli.exe; else tar -czf ../../../$name.tar.gz unreal-cli; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: unreal-cli-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum unreal-cli-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            unreal-cli-*
            SHA256SUMS
