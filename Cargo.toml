[package]
name = "unrealengine-cli"
version = "0.5.0"
edition = "2024"
description = "Rust CLI that lets AI agents drive Unreal Editor"
license = "MIT"

[lib]
name = "unrealengine_cli"
path = "src/lib.rs"

[[bin]]
name = "unrealengine-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
include_dir = "0.7.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"

[dev-dependencies]
assert_cmd = "2.2.2"
clap = "4.6.7"
jsonschema = "0.58.6"
tempfile = "3.27.0"

[lints.clippy]
result_large_err = "allow"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
