[package]
name = "unreal-cli"
version = "0.1.0"
edition = "2024"
description = "Rust CLI that lets AI agents drive Unreal Editor"
license = "MIT"

[lib]
name = "unreal_cli"
path = "src/lib.rs"

[[bin]]
name = "unreal-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = "0.58.6"
tempfile = "3.27.0"
